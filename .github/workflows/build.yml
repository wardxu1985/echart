name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set build version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            BASE=$(awk -F'"' '/^version *=/{gsub(/ /,"",$2); print $2; exit}' src-tauri/Cargo.toml)
            VERSION="${BASE:-0.1.0}-$(date +%Y%m%d)-${{ github.run_number }}"
          fi
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          # 统一更新版本号：Cargo.toml 与 tauri.conf.json（匹配任意已存在版本）
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          echo "Version set to: $VERSION"

      - name: Install npm dependencies
        run: npm install
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Build Tauri app
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: signal-viewer-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/signal-viewer.exe
