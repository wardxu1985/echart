<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>信号查看器</title>
  <link rel="stylesheet" href="static/style.css?v=31">
  <style>
    @keyframes loadingBarShimmer {
      0%   { width:8%;  opacity:0.5; }
      50%  { width:60%; opacity:1;   }
      100% { width:8%;  opacity:0.5; }
    }
  </style>
</head>
<body>
  <!-- 菜单栏 -->
  <div id="menuBar">
    <div class="menu-item" id="menuOpenFile">📂 打开文件</div>
    <div class="menu-item" id="menuMarkerList" style="display:none;">📍 记号列表</div>
    <div class="menu-item" id="menuClearMarkers" style="display:none;">🗑 清空记号</div>
    <div class="menu-item" id="menuRtmAnalysis">📊 RTM分析</div>
    <span class="menu-version" id="menuVersion">v0.1.0 · wardxu</span>
  </div>

  <!-- Tab 栏 -->
  <div id="tabBar"></div>

  <!-- 主内容区 -->
  <div id="mainLayout">
    <!-- 左面板 -->
    <div id="leftPanel">
      <div id="fileInfo">
        <div id="fileLabel">未加载文件</div>
      </div>

      <div class="panel-section">
        <label class="section-title">X 轴（时间）</label>
        <select id="xSelect" disabled>
          <option value="">— 请先打开文件 —</option>
        </select>
      </div>

      <div class="panel-section">
        <label class="section-title">信号</label>
        <button id="selectSignalBtn" disabled>选择信号...</button>
        <div id="signalTags"></div>
        <div class="tag-count" id="signalCount">已选 0 个信号</div>
      </div>

      <!-- 信号运算 -->
      <div class="panel-section" id="computeSection" style="display:none;">
        <label class="section-title">信号运算</label>
        <div class="compute-row">
          <div class="searchable-dropdown" id="signalADropdown">
            <input type="text" id="signalAInput" class="dropdown-input" placeholder="— 信号 A —" disabled>
            <div class="dropdown-list" id="signalAList"></div>
          </div>
          <select id="computeOp" class="compute-op" disabled>
            <option value="+">+</option>
            <option value="-">−</option>
          </select>
          <div class="searchable-dropdown" id="signalBDropdown">
            <input type="text" id="signalBInput" class="dropdown-input" placeholder="— 信号 B —" disabled>
            <div class="dropdown-list" id="signalBList"></div>
          </div>
        </div>
        <div class="compute-row">
          <input type="text" id="computeResultName" class="compute-name" placeholder="结果名称" disabled>
          <button id="computeBtn" class="compute-btn" disabled>✚ 添加</button>
        </div>
      </div>

      <button id="generateBtn" disabled>🎨 生成图表</button>
    </div>

    <!-- 图表区 -->
    <div id="chartArea">
      <div id="vinBanner" style="display:none;padding:6px 16px;margin-bottom:8px;background:#fef3e2;border-bottom:1px solid #f0c78e;font-size:13px;color:#8a6d3b;font-weight:600;"></div>
      <div id="chartPlaceholder">
        <p>📊 请打开 Excel 文件，选择信号后生成图表</p>
      </div>
      <div id="chartContainer" style="display:none;"></div>
      <div id="dataZoomBar"></div>
    </div>
  </div>

  <!-- 信号选择弹窗 -->
  <div id="signalDialogOverlay" class="dialog-overlay">
    <div id="signalDialog" class="dialog">
      <div class="dialog-header">
        <h3>选择信号</h3>
        <span class="dialog-close" id="dialogCloseBtn">✕</span>
      </div>
      <div class="dialog-body">
        <input type="text" id="signalSearch" placeholder="搜索信号名称...">
        <div id="signalList"></div>
      </div>
      <div class="dialog-footer">
        <span id="dialogCount">已选 0 / 0 个信号</span>
        <div class="dialog-actions">
          <button id="dialogSelectAll">全选</button>
          <button id="dialogClearAll">清空</button>
          <button class="btn-primary" id="dialogConfirmBtn">确定</button>
          <button id="dialogCancelBtn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载覆盖层 -->
  <div id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">正在加载文件…</div>
    <div class="loading-bar-track">
      <div id="loadingBarFill" class="loading-bar-fill"></div>
    </div>
  </div>

  <!-- 记号列表弹窗 -->
  <div id="markerDialogOverlay" class="dialog-overlay">
    <div class="dialog" style="width:700px;max-width:95vw;">
      <div class="dialog-header">
        <h3>记号列表</h3>
        <span class="dialog-close" id="markerDialogCloseBtn">✕</span>
      </div>
      <div class="dialog-body" style="max-height:60vh;overflow:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead id="markerTableHead"></thead>
          <tbody id="markerTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== RTM 分析弹窗 ===== -->
  <div id="rtmDialogOverlay" class="dialog-overlay">
    <div id="rtmDialog" class="dialog rtm-dialog">
      <div class="dialog-header">
        <h3>📊 RTM分析</h3>
        <div class="rtm-col-select">
          <select id="rtmGroupColSelect" style="font-size:13px;padding:3px 8px;border:1px solid var(--color-border);border-radius:4px;">
            <option>— 选择数据列 —</option>
          </select>
        </div>
        <span class="dialog-close" id="rtmDialogCloseBtn">✕</span>
      </div>
      <div class="dialog-body rtm-body">
        <div class="rtm-left">
          <!-- 选择方式 -->
          <div class="rtm-select-mode">
            <div class="rtm-mode-section">
              <label class="rtm-mode-label">▸ 从记号点选择</label>
              <select id="rtmMarkerSelect" class="rtm-select">
                <option value="">— 选择记号 —</option>
              </select>
            </div>
            <div class="rtm-mode-section">
              <label class="rtm-mode-label">▸ 选择时间点</label>
              <input type="datetime-local" id="rtmDatetimePicker" class="rtm-datetime">
            </div>
            <div class="rtm-mode-section">
              <label class="rtm-mode-label">▸ 从时间列表选择</label>
              <button id="rtmOpenTimeListBtn" class="rtm-btn">📋 打开时间列表</button>
            </div>
          </div>
        </div>
        <div class="rtm-right">
          <div class="rtm-stats-row">
            <div id="rtmStats" class="rtm-stats">
              <span>最高: <strong id="rtmStatMax">—</strong></span>
              <span>最低: <strong id="rtmStatMin">—</strong></span>
              <span>平均: <strong id="rtmStatAvg">—</strong></span>
              <span>个数: <strong id="rtmStatCount">—</strong></span>
            </div>
            <button id="rtmClearRtmMarkers" class="rtm-btn-small" title="清空在RTM图表上点击添加的记号">🗑 清空标记</button>
          </div>
          <div id="rtmChartContainer" class="rtm-chart-box"></div>
          <div id="rtmNoData" class="rtm-nodata">请选择数据分析列和时间点</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 时间列表弹窗（搜索/排序） ===== -->
  <div id="rtmTimeListOverlay" class="dialog-overlay">
    <div class="dialog" style="width:80vw;max-width:1000px;max-height:80vh;">
      <div class="dialog-header">
        <h3>选择时间点</h3>
        <span class="dialog-close" id="rtmTimeListCloseBtn">✕</span>
      </div>
      <div class="dialog-body" style="padding:12px 20px;">
        <div style="margin-bottom:8px;">
          <input type="text" id="rtmTimeSearch" placeholder="搜索时间... (如输入 20:58 过滤)" style="width:300px;padding:6px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;outline:none;">
        </div>
        <div style="max-height:55vh;overflow:auto;">
          <table id="rtmTimeTable" class="rtm-time-table">
            <thead>
              <tr>
                <th data-sort="time" class="sortable">时间 <span class="sort-arrow"></span></th>
                <th data-sort="max" class="sortable">最高(V) <span class="sort-arrow"></span></th>
                <th data-sort="min" class="sortable">最低(V) <span class="sort-arrow"></span></th>
                <th data-sort="range" class="sortable">差值(V) <span class="sort-arrow"></span></th>
                <th data-sort="avg" class="sortable">平均(V) <span class="sort-arrow"></span></th>
                <th>记号</th>
              </tr>
            </thead>
            <tbody id="rtmTimeTableBody"></tbody>
          </table>
        </div>
        <div id="rtmTimeCount" style="text-align:right;font-size:11px;color:var(--color-text-tertiary);margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer"></div>

  <!-- 状态栏 -->
  <div id="statusBar">
    <span id="statusLeft">就绪</span>
    <span id="statusRight">
      <span id="statusFileInfo"></span>
    </span>
  </div>

  <script src="static/echarts.min.js"></script>
  <script src="static/dialog.js?v=31"></script>
  <script src="static/chart.js?v=31"></script>
  <script src="static/rtm.js?v=31"></script>
  <script src="static/app.js?v=31"></script>
</body>
</html>
