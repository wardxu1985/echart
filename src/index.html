<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信号查看器</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <!-- 菜单栏 -->
  <div id="menuBar">
    <div class="menu-item" id="menuOpenFile">📂 打开文件</div>
    <div class="menu-item" id="menuNewWindow" style="display:none;">🪟 以新窗口打开</div>
  </div>

  <!-- 主内容区 -->
  <div id="mainLayout">
    <!-- 左面板 -->
    <div id="leftPanel">
      <div id="fileInfo">
        <div id="fileLabel">未加载文件</div>
      </div>

      <div class="panel-section">
        <label class="section-title">X 轴（时间）</label>
        <select id="xSelect" disabled>
          <option value="">— 请先打开文件 —</option>
        </select>
      </div>

      <div class="panel-section">
        <label class="section-title">信号</label>
        <button id="selectSignalBtn" disabled>选择信号...</button>
        <div id="signalTags"></div>
        <div class="tag-count" id="signalCount">已选 0 个信号</div>
      </div>

      <!-- 信号运算 -->
      <div class="panel-section" id="computeSection" style="display:none;">
        <label class="section-title">信号运算</label>
        <div class="compute-row">
          <select id="computeSignalA" class="compute-select" disabled>
            <option value="">— 信号 A —</option>
          </select>
          <select id="computeOp" class="compute-op" disabled>
            <option value="+">+</option>
            <option value="-">−</option>
          </select>
          <select id="computeSignalB" class="compute-select" disabled>
            <option value="">— 信号 B —</option>
          </select>
        </div>
        <div class="compute-row">
          <input type="text" id="computeResultName" class="compute-name" placeholder="结果名称" disabled>
          <button id="computeBtn" class="compute-btn" disabled>✚ 添加</button>
        </div>
      </div>

      <button id="generateBtn" disabled>🎨 生成图表</button>
    </div>

    <!-- 图表区 -->
    <div id="chartArea">
      <div id="chartPlaceholder">
        <p>📊 请打开 Excel 文件，选择信号后生成图表</p>
      </div>
      <div id="chartContainer" style="display:none;"></div>
      <div id="dataZoomBar"></div>
    </div>
  </div>

  <!-- 信号选择弹窗 -->
  <div id="signalDialogOverlay" class="dialog-overlay" style="display:none;">
    <div id="signalDialog" class="dialog">
      <div class="dialog-header">
        <h3>选择信号</h3>
        <span class="dialog-close" id="dialogCloseBtn">✕</span>
      </div>
      <div class="dialog-body">
        <input type="text" id="signalSearch" placeholder="搜索信号名称...">
        <div id="signalList"></div>
      </div>
      <div class="dialog-footer">
        <span id="dialogCount">已选 0 / 0 个信号</span>
        <div class="dialog-actions">
          <button id="dialogSelectAll">全选</button>
          <button id="dialogClearAll">清空</button>
          <button class="btn-primary" id="dialogConfirmBtn">确定</button>
          <button id="dialogCancelBtn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载覆盖层 -->
  <div id="loadingOverlay" style="display:none;">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">正在加载文件…</div>
  </div>

  <!-- Toast 容器 -->
  <div id="toastContainer"></div>

  <!-- 状态栏 -->
  <div id="statusBar">
    <span id="statusLeft">就绪</span>
    <span id="statusRight"></span>
  </div>

  <script src="static/echarts.min.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
